<title>Notekartotek</title>
<style>
  :root { --bg:#fff; --fg:#1d1d1f; --muted:#6b7280; --line:#e5e7eb; --head:#f3f4f6; --accent:#2563eb; --hover:#f9fafb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111418; --fg:#e5e7eb; --muted:#9ca3af; --line:#2b3037; --head:#1b1f25; --accent:#60a5fa; --hover:#171b20; }
  }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, sans-serif; }
  h1 { margin:0 0 12px; font-size:20px; }
  .toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px; }
  input, select, button { font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:4px; padding:4px 6px; }
  button { cursor:pointer; }
  #q { flex:1 1 260px; min-width:200px; }
  #count { color:var(--muted); margin-left:auto; }
  .wrap { overflow:auto; max-height:calc(100vh - 110px); border:1px solid var(--line); }
  table { border-collapse:collapse; width:100%; }
  th, td { padding:5px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  thead th { position:sticky; background:var(--head); z-index:1; }
  thead tr.labels th { top:0; cursor:pointer; user-select:none; white-space:nowrap; }
  thead tr.filters th { top:var(--lh,30px); padding:3px 4px; }
  thead tr.filters input, thead tr.filters select { width:100%; box-sizing:border-box; }
  th .arrow { color:var(--accent); }
  tbody tr:hover { background:var(--hover); }
  mark { background:#fde68a; color:#000; padding:0; }
  td.num, td.center { text-align:right; white-space:nowrap; }
  td.center { text-align:center; }
  tr.row { cursor:pointer; }
  tr.row.open { background:var(--hover); }
  .star { color:var(--accent); font-weight:bold; }
  tr.detail td { background:var(--hover); padding:6px 8px 10px 30px; }
  tr.detail dl { display:flex; flex-wrap:wrap; gap:6px 32px; margin:0; }
  tr.detail dt { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
  tr.detail dd { margin:0; }
  tr.detail .empty { color:var(--muted); }
  @media (max-width: 640px) {
    body { padding:8px; }
    th, td { padding:5px 6px; }
    .wrap { max-height:calc(100vh - 150px); }
    td { overflow-wrap:anywhere; }
    #q { min-width:0; }
  }
  .print-only { display:none; }
  @media print {
    body { padding:0; background:#fff; color:#000; font-size:10pt; }
    .toolbar, tr.filters { display:none; }
    .print-only { display:block; margin:0 0 6px; font-size:9pt; color:#444; }
    .wrap { overflow:visible; max-height:none; border:0; }
    thead { display:table-header-group; }
    thead th { position:static; background:#eee !important; color:#000; }
    tr { break-inside:avoid; }
    th, td { padding:2px 4px; }
    mark { background:none; }
    @page { size:A4 landscape; margin:10mm; }
  }
</style>
</head>

<script>
// ---- Column definitions -------------------------------------------------
// type: text | number | bool | date. filter: "text" (substring) or "select" (exact value).
const COLUMNS = [
  { key: 'navn',        label: 'Navn',            type: 'text'   },
  { key: 'arkivRef',    label: 'Arkiv ref.',      type: 'number' },
  { key: 'sjanger',     label: 'Sjanger',         type: 'text',   filter: 'select' },
  { key: 'komponist',   label: 'Komponist',       type: 'text'   },
  { key: 'arr',         label: 'Arr',             type: 'text'   },
  { key: 'besetning',   label: 'Besetning',       type: 'text',   filter: 'select' },
  { key: 'komplett',    label: 'Komplett',        type: 'bool',   filter: 'select', detail: true },
  { key: 'grad',        label: 'Grad',            type: 'number', filter: 'select' },
  { key: 'beskrivelse', label: 'Intern beskrivelse', type: 'text', detail: true },
  { key: 'sistEndret',  label: 'Sist endret',     type: 'date',   detail: true },
];
// detail: true = not a table column; shown under the row when it is expanded (still searched and exported).
// Compact (phone) view: two merged virtual columns; the other columns move to the detail view.
const COMPACT = [
  { key: '_refNavn',  label: 'Arkiv ref.: Navn', type: 'text', parts: ['arkivRef', 'navn'],     sep: ': ', sortBy: ['navn', 'arkivRef'] },
  { key: '_kompArr',  label: 'Komponist / Arr',  type: 'text', parts: ['komponist', 'arr'],     sep: ' / ' },
];
const COMPACT_HIDDEN = ['sjanger', 'besetning', 'grad'];   // shown only in the detail view when compact
const ALL = COLUMNS.concat(COMPACT);
const colByKey = k => ALL.find(c => c.key === k);
const phone = window.matchMedia('(max-width: 640px)');
let VISIBLE, DETAILS;
function setMode() {
  VISIBLE = phone.matches ? COMPACT : COLUMNS.filter(c => !c.detail);
  DETAILS = COLUMNS.filter(c => c.detail || (phone.matches && COMPACT_HIDDEN.includes(c.key)));
}
setMode();
const expanded = new WeakSet();   // rows currently expanded

const DATA = JSON.parse(document.getElementById('data').textContent);
const collator = new Intl.Collator('nb', { numeric: true, sensitivity: 'base' });

// ---- State --------------------------------------------------------------
const state = {
  query: '',
  filters: {},          // key -> string (text substring, or exact value for selects)
  sort: [],             // [{key, dir: 1|-1}], first is primary
};

// ---- Helpers ------------------------------------------------------------
const norm = v => String(v ?? '').toLowerCase();
const display = (col, v) => col.type === 'bool' ? (v === true ? 'Ja' : v === false ? 'Nei' : '') : String(v ?? '');
// Text of a cell; virtual (merged) columns join their non-empty parts.
const cellText = (col, row) => col.parts
  ? col.parts.map(k => display(colByKey(k), row[k])).filter(Boolean).join(col.sep)
  : display(col, row[col.key]);
const escapeHtml = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function highlight(text, terms) {
  let html = escapeHtml(text);
  for (const t of terms) {
    if (!t) continue;
    const re = new RegExp(escapeHtml(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    html = html.replace(re, m => `<mark>${m}</mark>`);
  }
  return html;
}

// ---- Search / filter / sort --------------------------------------------
function matches(row) {
  const terms = norm(state.query).split(/\s+/).filter(Boolean);
  if (terms.length) {
    const hay = COLUMNS.map(c => norm(display(c, row[c.key]))).join('\n');
    if (!terms.every(t => hay.includes(t))) return false;
  }
  for (const col of ALL) {
    const f = state.filters[col.key];
    if (!f) continue;
    const v = cellText(col, row);
    if (col.filter === 'select') {
      if (f === '\u0000empty') { if (v !== '') return false; }
      else if (v !== f) return false;
    } else if (!norm(v).includes(norm(f))) return false;
  }
  return true;
}

function compare(a, b) {
  for (const { key: skey, dir } of state.sort) {
   for (const key of (colByKey(skey).sortBy || colByKey(skey).parts || [skey])) {
    const col = colByKey(key);
    const x = a[key], y = b[key];
    const xe = x === '' || x == null, ye = y === '' || y == null;
    if (xe !== ye) return xe ? 1 : -1;          // empty values always last
    let r;
    if (col.type === 'number' && typeof x === 'number' && typeof y === 'number') r = x - y;
    else if (col.type === 'bool') r = Number(x) - Number(y);
    else r = collator.compare(String(x), String(y));   // dates are ISO strings
    if (r) return r * dir;
   }
  }
  return 0;
}

function getRows() { return DATA.filter(matches).sort(compare); }

// ---- Rendering ----------------------------------------------------------
const labelsRow = document.querySelector('tr.labels');
const filtersRow = document.querySelector('tr.filters');
const tbody = document.querySelector('tbody');
const countEl = document.getElementById('count');

function buildHeader() {
  labelsRow.innerHTML = '';
  filtersRow.innerHTML = '';
  for (const col of VISIBLE) {
    const th = document.createElement('th');
    th.dataset.key = col.key;
    th.title = 'Klikk for å sortere (Shift+klikk for flere kolonner)';
    th.addEventListener('click', e => toggleSort(col.key, e.shiftKey));
    labelsRow.append(th);

    const fth = document.createElement('th');
    let el;
    if (col.filter === 'select') {
      el = document.createElement('select');
      const values = [...new Set(DATA.map(r => cellText(col, r)))];
      const hasEmpty = values.includes('');
      const sorted = values.filter(v => v !== '').sort(collator.compare);
      el.append(new Option('(alle)', ''));
      for (const v of sorted) el.append(new Option(v, v));
      if (hasEmpty) el.append(new Option('(tom)', '\u0000empty'));
      el.addEventListener('change', () => { state.filters[col.key] = el.value; render(); });
    } else {
      el = document.createElement('input');
      el.type = 'search';
      el.placeholder = 'Filter';
      el.addEventListener('input', () => { state.filters[col.key] = el.value; render(); });
    }
    el.dataset.key = col.key;
    fth.append(el);
    filtersRow.append(fth);
  }
  updateSortArrows();
}

function updateSortArrows() {
  for (const th of labelsRow.children) {
    const col = colByKey(th.dataset.key);
    const i = state.sort.findIndex(s => s.key === col.key);
    const arrow = i < 0 ? '' : ` <span class="arrow">${state.sort[i].dir === 1 ? '▲' : '▼'}${state.sort.length > 1 ? i + 1 : ''}</span>`;
    th.innerHTML = escapeHtml(col.label) + arrow;
  }
}

function toggleSort(key, additive) {
  const cur = state.sort.find(s => s.key === key);
  if (!additive) state.sort = state.sort.filter(s => s.key === key);   // plain click: sort by this column only
  if (!cur) state.sort.push({ key, dir: 1 });
  else if (cur.dir === 1) cur.dir = -1;
  else state.sort = state.sort.filter(s => s.key !== key);             // third click removes the sort
  render();
}

let currentRows = [];
function render() {
  const rows = getRows();
  const terms = norm(state.query).split(/\s+/).filter(Boolean);
  tbody.innerHTML = rows.map((r, i) => {
    const open = expanded.has(r);
    const main = `<tr class="row${open ? ' open' : ''}" data-i="${i}" tabindex="0" aria-expanded="${open}">` + VISIBLE.map(col => {
      const cls = col.type === 'number' ? 'num' : col.type === 'bool' ? 'center' : '';
      return `<td class="${cls}">${highlight(cellText(col, r), terms)}${r.beskrivelse && (col.key === 'navn' || col.key === '_refNavn') ? ' <span class="star" title="Har intern beskrivelse">*</span>' : ''}</td>`;
    }).join('') + '</tr>';
    if (!open) return main;
    const detail = DETAILS.map(col => {
      const v = display(col, r[col.key]);
      return `<div><dt>${escapeHtml(col.label)}</dt><dd>${v ? highlight(v, terms) : '<span class="empty">–</span>'}</dd></div>`;
    }).join('');
    return main + `<tr class="detail"><td colspan="${VISIBLE.length}"><dl>${detail}</dl></td></tr>`;
  }).join('');
  currentRows = rows;
  countEl.textContent = `${rows.length} av ${DATA.length}`;
  updateSortArrows();
}

// ---- Export to Excel (.xlsx, built in-browser, no libraries) ------------
const crcTable = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (const b of bytes) c = crcTable[(c ^ b) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

// Minimal ZIP writer (stored, no compression)
function zip(files) {
  const enc = new TextEncoder(), parts = [], central = [];
  let offset = 0;
  const u16 = n => [n & 255, n >>> 8 & 255], u32 = n => [n & 255, n >>> 8 & 255, n >>> 16 & 255, n >>> 24 & 255];
  for (const [name, text] of Object.entries(files)) {
    const nameB = enc.encode(name), data = enc.encode(text), crc = crc32(data);
    const common = [...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(nameB.length), ...u16(0)];
    parts.push(new Uint8Array([0x50, 0x4B, 3, 4, ...common]), nameB, data);
    central.push(new Uint8Array([0x50, 0x4B, 1, 2, ...u16(20), ...common, ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(offset)]), nameB);
    offset += 30 + nameB.length + data.length;
  }
  const cdSize = central.reduce((s, a) => s + a.length, 0), n = Object.keys(files).length;
  return new Blob([...parts, ...central, new Uint8Array([0x50, 0x4B, 5, 6, 0, 0, 0, 0, ...u16(n), ...u16(n), ...u32(cdSize), ...u32(offset), 0, 0])],
    { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

const xmlEscape = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
const colLetter = i => String.fromCharCode(65 + i);

function exportExcel() {
  const rows = getRows();
  const cell = (col, v, r, c) => {
    const ref = colLetter(c) + r;
    if (v === '' || v == null) return '';
    if (col.type === 'number' && typeof v === 'number') return `<c r="${ref}"><v>${v}</v></c>`;
    if (col.type === 'bool') return `<c r="${ref}" t="b"><v>${v ? 1 : 0}</v></c>`;
    return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlEscape(v)}</t></is></c>`;
  };
  const head = `<row r="1">${COLUMNS.map((c, i) => `<c r="${colLetter(i)}1" s="1" t="inlineStr"><is><t>${xmlEscape(c.label)}</t></is></c>`).join('')}</row>`;
  const body = rows.map((row, i) => `<row r="${i + 2}">${COLUMNS.map((c, j) => cell(c, row[c.key], i + 2, j)).join('')}</row>`).join('');
  const widths = COLUMNS.map(c => Math.min(60, Math.max(c.label.length + 2, ...rows.slice(0, 500).map(r => display(c, r[c.key]).length + 2))));
  const last = colLetter(COLUMNS.length - 1);
  const sheet = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>
<cols>${widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('')}</cols>
<sheetData>${head}${body}</sheetData>
<autoFilter ref="A1:${last}${rows.length + 1}"/>
</worksheet>`;
  const ns = 'http://schemas.openxmlformats.org/';
  const blob = zip({
    '[Content_Types].xml': `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="${ns}package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`,
    '_rels/.rels': `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${ns}package/2006/relationships"><Relationship Id="rId1" Type="${ns}officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`,
    'xl/workbook.xml': `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="${ns}spreadsheetml/2006/main" xmlns:r="${ns}officeDocument/2006/relationships"><sheets><sheet name="Notekartotek" sheetId="1" r:id="rId1"/></sheets></workbook>`,
    'xl/_rels/workbook.xml.rels': `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${ns}package/2006/relationships"><Relationship Id="rId1" Type="${ns}officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="${ns}officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`,
    'xl/styles.xml': `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="${ns}spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs></styleSheet>`,
    'xl/worksheets/sheet1.xml': sheet,
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Notekartotek.xlsx';
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ---- Print --------------------------------------------------------------
function printTable() {
  const parts = [];
  if (state.query) parts.push(`søk: «${state.query}»`);
  for (const col of ALL) {
    const f = state.filters[col.key];
    if (f) parts.push(`${col.label}: ${f === '\u0000empty' ? '(tom)' : f}`);
  }
  if (state.sort.length) parts.push('sortert på ' + state.sort.map(s => colByKey(s.key).label + (s.dir === 1 ? ' ↑' : ' ↓')).join(', '));
  document.getElementById('printInfo').textContent =
    `${getRows().length} av ${DATA.length} noter · ${new Date().toLocaleDateString('nb')}` + (parts.length ? ' · ' + parts.join(' · ') : '');
  window.print();
}
function toggleRow(tr) {
  const row = currentRows[+tr.dataset.i];
  if (!row) return;
  expanded.has(row) ? expanded.delete(row) : expanded.add(row);
  const y = tbody.parentElement.parentElement.scrollTop;
  render();
  tbody.parentElement.parentElement.scrollTop = y;
}
tbody.addEventListener('click', e => { const tr = e.target.closest('tr.row'); if (tr && !getSelection().toString()) toggleRow(tr); });
tbody.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const tr = e.target.closest('tr.row'); if (!tr) return;
  e.preventDefault(); toggleRow(tr);
  tbody.querySelector(`tr.row[data-i="${tr.dataset.i}"]`)?.focus();
});
document.getElementById('export').addEventListener('click', exportExcel);
document.getElementById('print').addEventListener('click', printTable);

// ---- Wiring -------------------------------------------------------------
document.getElementById('q').addEventListener('input', e => { state.query = e.target.value; render(); });
document.getElementById('reset').addEventListener('click', () => {
  state.query = ''; state.filters = {}; state.sort = [];
  document.getElementById('q').value = '';
  document.querySelectorAll('tr.filters input, tr.filters select').forEach(el => el.value = '');
  render();
});

// Switch between the full and the compact view when the screen size changes.
phone.addEventListener('change', () => {
  setMode();
  const keep = new Set(VISIBLE.map(c => c.key));              // drop filters/sorts on columns that are no longer shown
  for (const k of Object.keys(state.filters)) if (!keep.has(k)) delete state.filters[k];
  state.sort = state.sort.filter(s => keep.has(s.key));
  buildHeader();
  document.documentElement.style.setProperty('--lh', labelsRow.offsetHeight + 'px');
  render();
});

buildHeader();
document.documentElement.style.setProperty('--lh', labelsRow.offsetHeight + 'px');
render();
</script>
</body>
